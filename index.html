<!doctype html>
<html lang="hr" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Mobile app -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AlloLokal" />
    <meta name="application-name" content="AlloLokal" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Base SEO — remplacé dynamiquement par react-helmet-async -->
    <title>AlloLokal — Services à domicile en Croatie</title>
    <meta name="description" content="AlloLokal est la plateforme de référence pour trouver et réserver des professionnels qualifiés en Croatie : beauté, ménage, bien-être, jardinage et plus." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://allolokal.com" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="AlloLokal" />
    <meta property="og:title"       content="AlloLokal — Services à domicile en Croatie" />
    <meta property="og:description" content="Trouvez et réservez des professionnels qualifiés près de chez vous en quelques clics." />
    <meta property="og:image"       content="https://allolokal.com/og-image.jpg" />
    <meta property="og:url"         content="https://allolokal.com" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@allolokal" />
    <meta name="twitter:title"       content="AlloLokal — Services à domicile en Croatie" />
    <meta name="twitter:description" content="Trouvez et réservez des professionnels qualifiés près de chez vous en quelques clics." />
    <meta name="twitter:image"       content="https://allolokal.com/og-image.jpg" />

    <!-- Thème -->
    <meta name="theme-color" content="#f59e0b" />
  </head>
  <body>
    <noscript>AlloLokal nécessite JavaScript. Veuillez l'activer dans votre navigateur — <a href="mailto:support@allolokal.com">support@allolokal.com</a></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
